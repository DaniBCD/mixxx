name: Build Installers (Windows & Linux)

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 EXE Installer
    runs-on: windows-2022
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
  
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
  
      - name: Setup Mixxx Windows dependencies
        shell: cmd
        run: |
          call tools\windows_buildenv.bat setup
  
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release
  
      - name: Build Mixxx
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
  
      # IMPORTANTE:
      # comprobar primero dónde ha salido mixxx.exe
      - name: Locate mixxx.exe
        shell: pwsh
        run: |
          Write-Host "Buscando mixxx.exe..."
  
          $exe = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "mixxx.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
  
          if (-not $exe) {
            Write-Host "NO SE HA ENCONTRADO MIXXX.EXE"
            Write-Host "Contenido del directorio build:"
  
            Get-ChildItem build -Recurse |
              Select-Object FullName
  
            throw "La compilacion no genero mixxx.exe"
          }
  
          Write-Host ""
          Write-Host "MIXXX.EXE ENCONTRADO:"
          Write-Host $exe.FullName
  
          "MIXXX_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "MIXXX_DIR=$($exe.Directory.FullName)" >> $env:GITHUB_ENV
  
      # Copiamos todo lo que acompaña al exe
      - name: Prepare application directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path "${{ github.workspace }}\package" `
            -Force
  
          Write-Host "Copiando aplicación desde:"
          Write-Host "${{ env.MIXXX_DIR }}"
  
          Copy-Item `
            "${{ env.MIXXX_DIR }}\*" `
            "${{ github.workspace }}\package" `
            -Recurse `
            -Force
  
          # Recursos
          if (Test-Path "${{ github.workspace }}\res") {
            Copy-Item `
              "${{ github.workspace }}\res" `
              "${{ github.workspace }}\package\res" `
              -Recurse `
              -Force
          }
  
      - name: Verify package
        shell: pwsh
        run: |
          Write-Host "Contenido de package:"
          Get-ChildItem package -Recurse |
            Select-Object FullName
  
          $exe = Get-ChildItem package `
            -Filter "mixxx.exe" `
            -Recurse |
            Select-Object -First 1
  
          if (-not $exe) {
            throw "mixxx.exe no existe dentro de package"
          }
  
          Write-Host ""
          Write-Host "OK - mixxx.exe preparado:"
          Write-Host $exe.FullName
  
      # Instalar Inno Setup
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
  
      # Crear el script del instalador
      - name: Create Inno Setup configuration
        shell: pwsh
        run: |
          @'
          [Setup]
          AppName=Mixxx
          AppVersion=Custom
          AppPublisher=Mixxx
          DefaultDirName={autopf}\Mixxx
          DefaultGroupName=Mixxx
  
          OutputDir=dist
          OutputBaseFilename=Mixxx-Setup-Windows-x64
  
          Compression=lzma2
          SolidCompression=yes
  
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
  
          PrivilegesRequired=admin
  
          WizardStyle=modern
  
          [Files]
          Source: "package\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
  
          [Icons]
          Name: "{group}\Mixxx"; Filename: "{app}\mixxx.exe"
          Name: "{autodesktop}\Mixxx"; Filename: "{app}\mixxx.exe"
  
          [Run]
          Filename: "{app}\mixxx.exe"; Description: "Abrir Mixxx"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss
  
      - name: Build EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
  
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer.iss
  
      - name: Verify EXE installer
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "INSTALADORES GENERADOS:"
          Get-ChildItem dist
  
          $installer = Get-ChildItem dist `
            -Filter "*.exe" |
            Select-Object -First 1
  
          if (-not $installer) {
            throw "No se ha generado el instalador EXE"
          }
  
          Write-Host ""
          Write-Host "EXE GENERADO CORRECTAMENTE:"
          Write-Host $installer.FullName
  
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-Windows-x64-EXE
          path: dist/*.exe
          if-no-files-found: error
  build-linux:
    name: Linux Ubuntu x64 Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          ./tools/debian_buildenv.sh setup

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Mixxx Release
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package with CPack
        run: |
          mkdir -p dist
          cd build
          cpack -G DEB -B ../dist || true
          cpack -G TGZ -B ../dist || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-linux-ubuntu
          path: dist/*
