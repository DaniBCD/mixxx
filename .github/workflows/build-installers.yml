name: Build Installers (Windows & Linux)

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Installer
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Windows Build Environment
        shell: cmd
        run: |
          call tools\windows_buildenv.bat setup

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Mixxx Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Windows Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          # Copy Qt plugins and resources to Release folder
          Copy-Item -Path "res\*" -Destination "build\Release\" -Recurse -Force
          Copy-Item -Path "${{ env.MIXXX_VCPKG_ROOT }}\installed\x64-windows\Qt6\plugins\*" -Destination "build\Release\" -Recurse -Force
          
          # Compress to zip for easy portable distribution
          Compress-Archive -Path "build\Release\*" -DestinationPath "dist\mixxx-windows-x64-portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-windows-x64
          path: dist\mixxx-windows-x64-portable.zip

  build-linux:
    name: Linux Ubuntu x64 Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          ./tools/debian_buildenv.sh setup

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Mixxx Release
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package with CPack
        run: |
          mkdir -p dist
          cd build
          cpack -G DEB -B ../dist || true
          cpack -G TGZ -B ../dist || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-linux-ubuntu
          path: dist/*
